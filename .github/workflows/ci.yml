name: CI
on:
  push:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run pytest tests/unit
  integration-tests:
    needs: [lint, unit-tests]
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: smartflow
          POSTGRES_PASSWORD: smartflow
          POSTGRES_DB: smartflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartflow -d smartflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SMARTFLOW_TEST_DATABASE_URL: postgresql+asyncpg://smartflow:smartflow@localhost:5432/smartflow_test
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run pytest tests/integration
  name: Docker build
  on:
    push:
      branches: [main]
      tags: ['[0-9]+.[0-9]+.[0-9]+']
    pull_request:
    workflow_dispatch:

  env:
    IMAGE: ddosreis/smartflow
    PUSH: ${{ startsWith(github.ref, 'refs/tags/') }}

  jobs:
    image:
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - uses: actions/checkout@v5

        - uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          if: env.PUSH == 'true'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Image tags
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ env.IMAGE }}
            tags: |
              type=semver,pattern={{version}}

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: ${{ env.PUSH == 'true' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

