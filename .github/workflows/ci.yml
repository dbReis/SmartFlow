name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run unit tests
        run: uv run pytest

  docker:
    # Builds the image and runs it next to a real PostgreSQL, exactly like
    # `docker compose up` does locally, then calls the API over HTTP.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build and start API + PostgreSQL
        # --wait returns once both containers report healthy (or fails).
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl --fail-with-body --silent http://localhost:8888/api/health
          echo
          curl --fail-with-body --silent -X POST http://localhost:8888/api/feedback \
            -H "Content-Type: application/json" -d '{"rating": 5, "note": "CI smoke test"}'
          echo
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -X POST http://localhost:8888/api/feedback -d '{"rating": 9}')
          test "$status" = "422" || { echo "expected 422 for an invalid rating, got $status"; exit 1; }
          curl --fail --silent --output /dev/null http://localhost:8888/docs

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
