name: CI
on:
  push:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run pytest tests/unit
  integration-tests:
    needs: [lint, unit-tests]
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: smartflow
          POSTGRES_PASSWORD: smartflow
          POSTGRES_DB: smartflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartflow -d smartflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SMARTFLOW_TEST_DATABASE_URL: postgresql+asyncpg://smartflow:smartflow@localhost:5432/smartflow_test
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run pytest tests/integration
  docker:
    needs: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build --tag smartflow:${{ github.sha }} .
