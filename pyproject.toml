[project]
name = "smartflow"
version = "0.1.0"
description = "Async RESTful API for rated user feedback, built with Tornado."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tornado>=6.5.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartflow"]
